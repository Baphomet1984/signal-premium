<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door-01 | Playlists MX</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #1DB954; /* Verde oficial de Spotify */
            --bg-dark: #000000; /* Fondo negro puro */
            --card-bg: #121212; /* Gris muy oscuro para las tarjetas */
            --card-border: #282828; /* Gris para bordes */
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-color);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 { 
            color: var(--primary-color); 
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 2rem;
            margin: 0;
        }

        h2 { 
            font-size: 1.2rem; 
            margin-top: 50px; 
            color: #b3b3b3;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        /* Contenedor de la lista */
        ul {
            list-style: none;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        /* Estilo de los botones */
        li a {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            padding: 16px 20px;
            border-radius: 8px; /* Bordes ligeramente redondeados */
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            border: 1px solid var(--card-border);
            font-weight: 500;
        }

        li a i {
            margin-right: 15px;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        /* Efecto al pasar el mouse */
        li a:hover {
            background: #282828;
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.2);
        }

        .widget-container {
            margin-top: 60px;
            background: #121212;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        footer {
            margin-top: 50px;
            text-align: center;
            padding-bottom: 40px;
        }

        /* Estilo para el contador */
        .footer-counter {
            filter: invert(1); /* Invierte color del contador si es necesario para fondo negro */
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <h1><i class="fab fa-spotify"></i> Playlists Top México</h1>
        </header>

        <main>
            <ul>
                <li><a href="https://open.spotify.com/playlist/37i9dQZEVXbO3qyFxbkOE1?si=wIVFtcz8SgGbBb6hjx1THQ"><i class="fab fa-spotify"></i> 1. TOP 50: MEXICO</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZEVXbLuUZrygauiA?si=njyQxmBESZyrGAHogoaIug"><i class="fab fa-spotify"></i> 2. VIRAL 50: MEXICO</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1DX5BAPG29mHS8?si=69rtevaFTw-aYvAVSMCTmQ"><i class="fab fa-spotify"></i> 3. EXITOS MEXICO</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1DWWhMyyrqZlaY?si=OMDlxjXnSzm_DfU3I2gdwQ"><i class="fab fa-spotify"></i> 4. CORRIDOS TUMBADOS</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1DX5hrSNdL1ktS?si=dJJFlH5hTCC5WUOIqrP1Sw"><i class="fab fa-spotify"></i> 5. REGGAETON MX</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1DWTmGGCbcoQhY?si=9htAtALLTWqE3o3LG9TqNg"><i class="fab fa-spotify"></i> 6. CUMBIA SONIDERA</a></li>
                <li><a href="https://open.spotify.com/playlist/1z9BMuPLZE7bVemN5E85rV?si=vs4BVFxjTgyUycoBLQpARQ"><i class="fab fa-spotify"></i> 7. HITS TIKTOK MEXICO</a></li>
            </ul>

            <h2>Música Alternativa</h2>
            <ul>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1EIea0ChiRU7ji?si=l1tpgnOTSceRtCiN5SMSWQ"><i class="fab fa-spotify"></i> 8. METAL DENSO</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1DWYMHB55fgZrY?si=C0gKOkwdS_OKb2gXXrERkQ"><i class="fab fa-spotify"></i> 9. ROCK MEXICANO</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1EIcM7vKLqtJgT?si=MU8P6kObS_efOEAuU7b73A"><i class="fab fa-spotify"></i> 10. TECHNO OSCURO</a></li>
                <li><a href="https://open.spotify.com/playlist/37i9dQZF1DWTe5ECpTKzMo?si=8IR6Y2vHRByTr_w5FnmT_w"><i class="fab fa-spotify"></i> 11. HIP-HOP MX 24K</a></li>
            </ul>

            <div class="widget-container">
                <iframe src='https://widget.spreaker.com/player?show_id=6247023&theme=dark&playlist=show&playlist-continuous=true&chapters-image=true' width='100%' height='400px' title='el panda show' frameborder='0'></iframe>
            </div>
        </main>

        <footer>
            <div class="footer-counter">
                <script type="text/javascript" src="https://contador.websiteout.com/js/2/5/0/0"></script>
            </div>
        </footer>
    </div>

</body>
</html>
